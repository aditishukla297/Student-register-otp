<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Student Registration</h1>
            <p>Complete your details to register</p>
        </header>

        <form action="process.php" method="POST" enctype="multipart/form-data">

            <div class="form-grid">

         

                <section class="card">
                    <h2>👤 Personal Information</h2>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>

                        <div class="radio-group">
                            <label>
                                <input type="radio" name="gender" value="male" required>
                                Male
                            </label>

                            <label>
                                <input type="radio" name="gender" value="female">
                                Female
                            </label>

                            <label>
                                <input type="radio" name="gender" value="other">
                                Other
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                </section>



                <section class="card">
                    <h2>🎓 Academic Information</h2>

                    <div class="form-group">
                        <label for="course">Course</label>

                        <select id="course" name="course" required>
                            <option value="">-- Select Course --</option>
                            <option value="btech">B.Tech</option>
                            <option value="bca">BCA</option>
                            <option value="bsc">B.Sc</option>
                            <option value="mca">MCA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="specialization">Specialization</label>

                        <select id="specialization" name="specialization">
                            <option value="">-- Select Specialization --</option>
                            <option value="cs">Computer Science</option>
                            <option value="it">Information Technology</option>
                            <option value="ai">Artificial Intelligence</option>
                            <option value="ds">Data Science</option>
                        </select>
                    </div>

                    <div class="form-group">

                        <label>Technical Skills</label>

                        <div class="skills-grid">

                            <label>
                                <input type="checkbox" name="skills[]" value="HTML">
                                HTML
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="CSS">
                                CSS
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="JavaScript">
                                JavaScript
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="PHP">
                                PHP
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Java">
                                Java
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="React">
                                React
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="SQL">
                                SQL
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Tailwind CSS">
                                Tailwind
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Next.js">
                                Next.js
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Node.js">
                                Node.js
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Express.js">
                                Express
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Git">
                                Git
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="GitHub">
                                GitHub
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="Docker">
                                Docker
                            </label>

                            <label>
                                <input type="checkbox" name="skills[]" value="REST API">
                                REST API
                            </label>

                        </div>

                    </div>

                </section>



                <section class="card">
                    <h2>📍 Address & Contact</h2>

                    <div class="form-group">
                        <label for="address">Address</label>

                        <textarea
                            id="address"
                            name="address"
                            rows="4"
                            placeholder="Enter your full address"
                            required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="state">State</label>

                        <select id="state" name="state" required>
                            <option value="">-- Select State --</option>
                            <option value="uttar_pradesh">Uttar Pradesh</option>
                            <option value="haryana">Haryana</option>
                            <option value="delhi">Delhi</option>
                            <option value="maharashtra">Maharashtra</option>
                            <option value="karnataka">Karnataka</option>
                            <option value="rajasthan">Rajasthan</option>
                            <option value="gujarat">Gujarat</option>
                            <option value="punjab">Punjab</option>
                            <option value="bihar">Bihar</option>
                            <option value="madhya_pradesh">Madhya Pradesh</option>
                            <option value="uttarakhand">Uttarakhand</option>
                            <option value="telangana">Telangana</option>
                            <option value="tamil_nadu">Tamil Nadu</option>
                            <option value="west_bengal">West Bengal</option>
                            <option value="kerala">Kerala</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="city">City</label>

                        <select id="city" name="city" required>
                            <option value="">-- Select City --</option>
                            <option value="bareilly">Bareilly</option>
                            <option value="lucknow">Lucknow</option>
                            <option value="kanpur">Kanpur</option>
                            <option value="agra">Agra</option>
                            <option value="varanasi">Varanasi</option>
                            <option value="meerut">Meerut</option>
                            <option value="gurugram">Gurugram</option>
                            <option value="faridabad">Faridabad</option>
                            <option value="panipat">Panipat</option>
                            <option value="rohtak">Rohtak</option>
                            <option value="new_delhi">New Delhi</option>
                            <option value="jaipur">Jaipur</option>
                            <option value="chandigarh">Chandigarh</option>
                            <option value="amritsar">Amritsar</option>
                            <option value="ludhiana">Ludhiana</option>
                            <option value="patna">Patna</option>
                            <option value="bhopal">Bhopal</option>
                            <option value="indore">Indore</option>
                            <option value="dehradun">Dehradun</option>
                            <option value="hyderabad">Hyderabad</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pincode">PIN Code</label>

                        <input
                            type="text"
                            id="pincode"
                            name="pincode"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required>
                    </div>

                </section>



                <section class="card">
                    <h2>📅 Schedule & Profile</h2>

                    <div class="form-group">
                        <label for="preferred_date">
                            Preferred Start Date
                        </label>

                        <input
                            type="date"
                            id="preferred_date"
                            name="preferred_date"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="preferred_time">
                            Preferred Time
                        </label>

                        <input
                            type="time"
                            id="preferred_time"
                            name="preferred_time"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="profile">
                            Profile Picture
                        </label>

                        <input
                            type="file"
                            id="profile"
                            name="profile"
                            accept="image/*">
                    </div>

                </section>


                <section class="card">
                    <h2>🔐 Account Information</h2>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            required>
                    </div>

                </section>



                <section class="card">

                    <h2>📱 Phone Verification</h2>

                    <p class="info">
                        OTP will be sent to your registered phone number.
                    </p>

                    <button type="button" id="sendOtp">
                        Send OTP
                    </button>

                    <div class="otp-row">

                        <input
                            type="text"
                            id="otp"
                            name="otp"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            placeholder="6-digit OTP">

                        <button type="button" id="verifyOtp">
                            Verify
                        </button>

                    </div>

                    <p id="otpStatus"></p>

                    <div class="resend">

                        <button
                            type="button"
                            id="resendOtp"
                            disabled>
                            Resend OTP
                        </button>

                        <span id="timer"></span>

                    </div>

                </section>

            </div>


            <section class="confirmation">

                <h2>✅ Confirmation</h2>

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        value="accepted"
                        required>

                    I agree to the terms and conditions.

                </label>

                <button type="submit" class="register-btn">
                    Register Student
                </button>

            </section>

        </form>

    </div>
    <script src="script.js"></script>
</body>
</html>
